name: topic-stream-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TOPIC_STREAM_POSTGRES_DB:?Set TOPIC_STREAM_POSTGRES_DB in .env}
      POSTGRES_USER: ${TOPIC_STREAM_POSTGRES_USER:?Set TOPIC_STREAM_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TOPIC_STREAM_POSTGRES_PASSWORD:?Set TOPIC_STREAM_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - topic-stream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - topic-stream-qdrant:/qdrant/storage

volumes:
  topic-stream-postgres:
  topic-stream-qdrant:
