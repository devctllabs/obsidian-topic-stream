          minimum: 0
          maximum: 59
    WeeklyRecurrence:
      type: object
      additionalProperties: false
      required:
        - frequency
        - weekdays
        - hour
        - minute
      properties:
        frequency:
          type: string
          const: weekly
        weekdays:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
