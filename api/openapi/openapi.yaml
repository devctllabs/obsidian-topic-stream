            - $ref: '#/components/schemas/MonthlyNthWeekdayRule'
            - $ref: '#/components/schemas/MonthlyLastDayRule'
          discriminator:
            propertyName: type
            mapping:
              dayOfMonth: '#/components/schemas/MonthlyDayOfMonthRule'
              nthWeekday: '#/components/schemas/MonthlyNthWeekdayRule'
              lastDay: '#/components/schemas/MonthlyLastDayRule'
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
