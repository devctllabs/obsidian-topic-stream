  responses:
    problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal-error:
              value:
                type: urn:topic-stream:problem:internal-error
                code: internal_error
                title: Internal Server Error
                status: 500
                detail: The server could not complete the request.
            source-validation:
              value:
                type: urn:topic-stream:problem:invalid-source
                code: invalid_source
                title: Invalid source
                status: 400
                detail: Check the source fields and try again.
                errors:
                  - field: name
                    message: This field is required.
                  - field: pollIntervalMinutes
                    message: Enter a value between 15 and 10080.
    projection-pending:
      description: Canonical PostgreSQL state committed but its retrieval projection could not be delivered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProjectionPendingProblem'
  headers:
    version-etag:
      description: Quoted integer resource version for optimistic updates.
      schema:
        type: string
  parameters:
    if-match-version:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version returned in the resource ETag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    source-id:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    topic-id:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    item-id:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    image-id:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    digest-id:
      name: digestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    issue-id:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    job-id:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    model-id:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
