name: Plugin release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Explicit stable plugin version increment
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: read

concurrency:
  group: release-plugin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    uses: ./.github/workflows/release-version.yml
    with:
      component: plugin
      bump: ${{ inputs.bump }}
      source_sha: ${{ github.sha }}

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.version.outputs.source_sha }}
      component: plugin
      race: false

  artifacts:
    name: Plugin release assets
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Build plugin assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          pnpm install --frozen-lockfile
          pnpm --dir plugin build
          test -s plugin/main.js
          test -s plugin/manifest.json
          test -s plugin/styles.css
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-release-${{ needs.version.outputs.source_sha }}
          path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    name: Plugin draft release
    needs: [version, checks, artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
      NOTES_PATH: plugin-release-notes.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          name: plugin-release-${{ needs.version.outputs.source_sha }}
          path: release-assets
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Validate immutable source and plugin metadata
        run: |
          set -euo pipefail
          test "$TAG" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r '.version' plugin/package.json)" = "$VERSION"
          test "$(jq -r '.version' plugin/manifest.json)" = "$VERSION"
          min_app_version=$(jq -r '.minAppVersion' plugin/manifest.json)
          jq -e --arg version "$VERSION" --arg minimum "$min_app_version" \
            '.[$version] == $minimum' plugin/versions.json > /dev/null
          test -s release-assets/main.js
          test -s release-assets/manifest.json
          test -s release-assets/styles.css

          remote_tag=$(git ls-remote origin "refs/tags/$TAG")
          if [ -n "$remote_tag" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
            echo "tag $TAG already points at the requested source; it will not be moved"
          fi

          response="$RUNNER_TEMP/release-response"
          error="$RUNNER_TEMP/release-error"
          status=0
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$response" 2> "$error" || status=$?
          http_status=$(awk '/^HTTP\// { code=$2 } END { print code }' "$response")
          if [ "$status" = 0 ] && [ "$http_status" = 200 ]; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          elif [ "$status" != 0 ] && [ "$http_status" = 404 ]; then
            :
          else
            cat "$error" >&2
            echo "release lookup failed; refusing publication" >&2
            exit 1
          fi
      - name: Generate component release notes
        run: |
          set -euo pipefail
          git-cliff --unreleased --tag "$TAG" \
            --tag-pattern '^[0-9]+\.[0-9]+\.[0-9]+$' \
            --include-path 'plugin/**' \
            --include-path 'package.json' \
            --include-path 'pnpm-lock.yaml' \
            --include-path 'pnpm-workspace.yaml' \
            --include-path 'api/openapi/**' \
            --include-path 'tools/oapi/**' \
            --include-path 'devctl.yaml' \
            --include-path 'redocly.yaml' \
            --output "$NOTES_PATH"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Plugin release notes

          $(cat "$NOTES_PATH")
          EOF
      - name: Create annotated tag and draft release
        run: |
          set -euo pipefail
          if [ -z "$(git ls-remote origin "refs/tags/$TAG")" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$SOURCE_SHA" -m "Plugin $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" \
            --title "Plugin $VERSION" --notes-file "$NOTES_PATH" --draft --latest=true \
            release-assets/main.js release-assets/manifest.json release-assets/styles.css
